<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141721" />
      <stop offset="100%" stop-color="#08090d" />
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Card -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="8" />
  
  <!-- Accent Red Corner Glow -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="none" stroke="url(#brand-grad)" stroke-width="12" filter="url(#glow)" opacity="0.85" />
  
  <!-- Monogram Logo: ME -->
  <g fill="#ffffff" font-family="'Syne', 'Outfit', sans-serif" font-weight="800">
    <!-- Stylized M -->
    <path d="M 120 360 V 152 H 168 L 224 270 L 280 152 H 328 V 360 H 284 V 230 L 236 332 H 212 L 164 230 V 360 Z" fill="#ffffff" />
    <!-- Stylized E / Slash Accent -->
    <path d="M 352 152 H 416 V 194 H 352 Z M 352 235 H 404 V 277 H 352 Z M 352 318 H 416 V 360 H 352 Z" fill="url(#brand-grad)" />
  </g>
</svg>
